name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write # lets the job mint the OIDC token npm uses for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm test

      # Publishes via npm Trusted Publishing (OIDC) — no token. The trusted publisher
      # (GitHub Actions, owner MrHadik, repo n8n-nodes-zaple, workflow publish.yml) is
      # registered on npmjs.com, and `id-token: write` above lets the job mint the OIDC
      # credential npm verifies. This also satisfies npm's 2FA-for-writes policy.
      - run: npm run release
